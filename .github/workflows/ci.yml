name: CI

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend – tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        run: mvn -B -ntp verify

  frontend:
    name: Frontend – i18n and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Translations complete in every language
        run: node tools/check-i18n.mjs
      - name: Build and prerender
        run: npx ng build

  docker:
    name: Production images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t carimport-api backend
      - run: docker build -t carimport-web frontend
      - name: nginx config is valid
        run: docker run --rm --add-host api:127.0.0.1 carimport-web nginx -t

  e2e:
    name: E2E – purchase (calculator → payment → PDF)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: carimport
          POSTGRES_USER: carimport
          POSTGRES_PASSWORD: carimport
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U carimport" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the API
        working-directory: backend
        run: mvn -B -ntp -DskipTests package
      - name: Build the site
        working-directory: frontend
        run: npm ci && npx ng build
      - name: Install Playwright
        working-directory: frontend
        run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Start the API (profile e2e = simulated Stripe) and the site
        run: |
          nohup java -jar backend/target/carimport-backend-*.jar --spring.profiles.active=e2e > api.log 2>&1 &
          nohup node frontend/e2e/serve.mjs 4300 http://localhost:8080 > web.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8080/actuator/health > /dev/null && break; sleep 2; done
          curl -sf localhost:8080/actuator/health
        env:
          DB_URL: jdbc:postgresql://localhost:5432/carimport
          DB_USER: carimport
          DB_PASSWORD: carimport
          FRONTEND_URL: http://localhost:4300
          REPORT_STORAGE_DIR: ${{ runner.temp }}/reports
      - name: Buy a report end to end
        working-directory: frontend
        run: node e2e/purchase.mjs http://localhost:4300
      - name: Logs and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            api.log
            web.log
            frontend/e2e/out/
