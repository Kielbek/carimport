name: Model photos

# Fetches the Wikimedia Commons photos for the model pages from a GitHub runner (Commons rate-limits
# shared cloud IPs) and commits them back. Run it by changing frontend/tools/photos.request.
on:
  push:
    branches: [main, master, 'claude/**']
    paths: [frontend/tools/photos.request]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-photos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Fetch photos
        run: |
          if grep -q "^pages" frontend/tools/photos.request; then
            cd frontend/tools && python3 fetch_page_photos.py
          else
            python3 frontend/tools/fetch_model_photos.py $(grep -v "^#" frontend/tools/photos.request)
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A frontend/tools frontend/public/images
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Model photos from Wikimedia Commons"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
