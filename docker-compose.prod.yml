# Production stack on one host: PostgreSQL, API, nginx with the static site. Secrets come from .env (see .env.example).
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Put TLS in front (Caddy, Traefik, a load balancer or Cloudflare) and forward to port 80.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: carimport
      POSTGRES_USER: carimport
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carimport"]
      interval: 10s

  api:
    build: backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/carimport
      DB_USER: carimport
    volumes: [reports:/data/reports]

  web:
    build: frontend
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80"]

volumes:
  pgdata:
  reports:
