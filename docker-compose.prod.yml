# Production stack on one host: PostgreSQL, API, nginx with the static site. Secrets come from .env (see .env.example).
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Put TLS in front (Caddy, Traefik, a load balancer or Cloudflare) and forward to port 80.
# docker's own log files are capped (5 x 20 MB per container) so a busy month cannot fill the disk
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: carimport
      POSTGRES_USER: carimport
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carimport"]
      interval: 10s

  api:
    build: backend
    restart: unless-stopped
    logging: *logging
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/carimport
      DB_USER: carimport
      # rotated application log (20 MB files, 14 days, max 1 GB) next to `docker compose logs api`
      LOG_FILE: /data/logs/api.log
    volumes: [reports:/data/reports, logs:/data/logs]

  web:
    build: frontend
    restart: unless-stopped
    logging: *logging
    depends_on: [api]
    ports: ["80:80"]

volumes:
  pgdata:
  reports:
  logs:
