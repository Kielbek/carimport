# Production stack on one host: Caddy (HTTPS) -> nginx with the static site -> API -> PostgreSQL, plus daily backups.
# Secrets and the domain come from .env (see .env.example). Bind mounts carry :z so they also work under SELinux
# (Fedora, RHEL); elsewhere the flag is ignored.
#   docker compose -f docker-compose.prod.yml up -d --build
# docker's own log files are capped (5 x 20 MB per container) so a busy month cannot fill the disk
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: carimport
      POSTGRES_USER: carimport
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carimport"]
      interval: 10s

  api:
    build: backend
    restart: unless-stopped
    logging: *logging
    # the JVM takes 75 % of this as heap; leaves room for PostgreSQL, nginx and Caddy on a 4 GB server
    mem_limit: 1536m
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/carimport
      DB_USER: carimport
      # rotated application log (20 MB files, 14 days, max 1 GB) next to `docker compose logs api`
      LOG_FILE: /data/logs/api.log
    volumes: [reports:/data/reports, logs:/data/logs]

  web:
    build: frontend
    restart: unless-stopped
    logging: *logging
    depends_on: [api]

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *logging
    depends_on: [web]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: carimport
      PGDATABASE: carimport
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro,z
      - ./backups:/backups:z
      - reports:/data/reports:ro

volumes:
  pgdata:
  reports:
  logs:
  caddy_data:
  caddy_config:
