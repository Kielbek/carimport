# Local development stack: PostgreSQL + API. Frontend: `cd frontend && npm start` (proxies /api to :8080).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carimport
      POSTGRES_USER: carimport
      POSTGRES_PASSWORD: carimport
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    image: eclipse-temurin:21-jre
    depends_on: [db]
    working_dir: /app
    command: ["java", "-jar", "carimport-backend-0.1.0-SNAPSHOT.jar"]
    volumes: ["./backend/target:/app"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/carimport
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_replace_me}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_replace_me}
      FRONTEND_URL: http://localhost:4200
    ports: ["8080:8080"]

volumes:
  pgdata:
