<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Carglo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101011" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f3f4" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Theme before first paint: stored choice, else OS preference (no light/dark flash). -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('carimport.theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
        // the home hero photo for this theme (kept in sync by ThemeService); set here because the CSS inlined at build
        // time only knows the light theme
        var s = document.documentElement.style, n = t === 'dark' ? 'night' : 'day';
        s.setProperty('--hero-photo-sm', 'url(/images/hero-' + n + '-750.webp)');
        s.setProperty('--hero-photo-lg', 'url(/images/hero-' + n + '-1100.webp)');
        s.setProperty('--hero-shade', t === 'dark' ? '16 16 17' : '243 243 244');
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
