    <!-- Theme before first paint: stored choice, else OS preference (no light/dark flash). -->
    <script>
      (function () {
        var t, l;
        try { t = localStorage.getItem('carimport.theme'); l = localStorage.getItem('carimport.lang'); } catch (e) {}
        // returning visitor on the bare domain: go to the saved language before anything is drawn (no English flash)
        if (location.pathname === '/' && /^(bg|cs|da|de|el|en|es|et|fi|fr|hr|hu|it|lt|lv|nl|pl|pt|ro|sk|sl|sv|uk)$/.test(l || '')) {
          location.replace('/' + l + location.search + location.hash);
          return;
        }
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
        if (!/bot|crawl|spider|slurp|lighthouse|headless|preview/i.test(navigator.userAgent)) {
          document.documentElement.classList.add('splash');
        }
        // the home hero photo for this theme (kept in sync by ThemeService); set here because the CSS inlined at build
        // time only knows the light theme
        var s = document.documentElement.style, n = t === 'dark' ? 'night' : 'day';
        s.setProperty('--hero-photo-sm', 'url(/images/hero-' + n + '-750.webp)');
        s.setProperty('--hero-photo-lg', 'url(/images/hero-' + n + '-1100.webp)');
        s.setProperty('--hero-shade', t === 'dark' ? '16 16 17' : '243 243 244');
      })();
    </script>
    <!-- Entry splash: a grey shimmering logo while fonts and the first images arrive (browser only, never for crawlers) -->
    <style>
      #splash{display:none}
      html.splash #splash{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#f3f3f4;transition:opacity .3s ease,visibility .3s}
      html.splash[data-theme='dark'] #splash{background:#101011}
      html.splash #splash.out{opacity:0;visibility:hidden}
      #splash svg{width:min(52vw,220px);height:auto}
      #splash .ink{fill:#d4d4d8}
      html[data-theme='dark'] #splash .ink{fill:#2a2a2e}
      #splash .glint{fill:url(#splash-glint)}
      @media (prefers-reduced-motion:reduce){#splash animateTransform{display:none}}
    </style>

    <script>
      (function () {
        var root = document.documentElement;
        if (!root.classList.contains('splash')) return;
        var start = Date.now(), done = false;
        function hide() {
          if (done) return;
          done = true;
          setTimeout(function () {
            var el = document.getElementById('splash');
            if (el) el.className = 'out';
            setTimeout(function () { root.classList.remove('splash'); }, 320);
          }, Math.max(0, 350 - (Date.now() - start)));
        }
        var fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
        var loaded = new Promise(function (r) { document.readyState === 'complete' ? r() : window.addEventListener('load', r); });
        var app = new Promise(function (r) { document.addEventListener('app-ready', r); });
        Promise.all([fonts, loaded, app]).then(hide, hide);
        setTimeout(hide, 2500);
      })();
    </script>
