<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Carglo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101011" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f3f4" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Theme before first paint: stored choice, else OS preference (no light/dark flash). -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('carimport.theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
