# Static site (prerendered HTML per language + client-rendered personal pages) and the API behind one origin.
# access log with the request id the API also logs ([id] in its lines) and the timings
log_format main_rid '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '$request_time $upstream_response_time "$http_user_agent" rid=$request_id';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log main_rid;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # inline scripts: theme bootstrap and Angular's event replay; fonts from Google Fonts; payments are a redirect
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API (rate limits and validation live in the application)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
    }
    location /actuator/ { return 404; }

    # hashed bundles never change
    location ~* "\.(?:js|css|woff2?)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location /i18n/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # prerendered pages (/pl/kalkulator/index.html), else the client-rendered shell (report, language redirect)
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/index.html /index.csr.html;
    }
}
