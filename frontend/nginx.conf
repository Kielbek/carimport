# Static site (prerendered HTML per language + client-rendered personal pages) and the API behind one origin.
# access log with the request id the API also logs ([id] in its lines) and the timings
log_format main_rid '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '$request_time $upstream_response_time "$http_user_agent" rid=$request_id';

# behind Caddy: the client address and scheme come from it (only private Docker addresses are trusted)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# the bare domain sends visitors to their browser language; crawlers send none and get English (the x-default)
map $http_accept_language $site_lang {
    default en;
    "~*^(?<l>bg|cs|da|de|el|en|es|et|fi|fr|hr|hu|it|lt|lv|nl|pl|pt|ro|sk|sl|sv|uk)" $l;
}

server {
    listen 80;
    server_name _;
    # relative Location headers: behind Caddy an absolute one would say http:// and add a second redirect
    absolute_redirect off;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log main_rid;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # inline scripts: theme bootstrap and Angular's event replay; fonts from Google Fonts; payments are a redirect
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API (rate limits and validation live in the application)
    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
    }
    location /actuator/ { return 404; }
    # for an uptime monitor (UptimeRobot, Better Stack): UP only when the API and its database answer
    location = /health {
        proxy_pass http://api:8080/actuator/health;
        access_log off;
    }

    # hashed bundles never change
    location ~* "\.(?:js|css|woff2?)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location ^~ /i18n/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # one URL per page: /pl/slownik/ -> /pl/slownik (the canonical form used in the sitemap and canonical tags)
    location ~ ^(?<path>/.+)/$ {
        return 301 $path$is_args$args;
    }
    location = / {
        add_header Cache-Control "no-store";
        add_header Vary "Accept-Language";
        return 302 /$site_lang$is_args$args;
    }

    # personal pages rendered in the browser: operator panel, quote links, bought reports, newsletter confirmation
    location ~ "^/(?:admin|[a-z]{2}/(?:result|report)/[^/]+|[a-z]{2}/newsletter)$" {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files /index.csr.html =404;
    }

    # prerendered pages (/pl/kalkulator/index.html) and static files; anything else is a real 404 (no "soft 404"
    # in Search Console) that still shows the site, whose router sends the visitor home
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /index.csr.html;
    location = /index.csr.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
