plan.step.clearance.title=Desalfandegamento no porto
plan.step.clearance.text=O despachante oficial apresenta a declaração (DAU); o utilizador paga os direitos e o IVA na importação. Necessário: fatura, conhecimento de embarque, Title/certificado de exportação, EORI.
plan.step.pl.excise.title=Declaração e pagamento do imposto especial de consumo (AKC-U/S)
plan.step.pl.excise.text=Apresente-a na repartição de finanças (ou online) e pague o imposto especial de consumo; o comprovativo é necessário para a matrícula.
plan.step.pl.exciseExemption.title=Declaração de isenção do imposto especial de consumo (carro elétrico)
plan.step.pl.exciseExemption.text=Os carros elétricos estão isentos, mas a declaração AKC-U/S tem de ser apresentada na mesma.
plan.step.translations.title=Traduções certificadas
plan.step.translations.text=Title/documento de registo estrangeiro, fatura e documento de exportação – por um tradutor ajuramentado.
plan.step.lighting.title=Adaptação da iluminação às normas da UE
plan.step.lighting.text=Piscas traseiros cor de laranja, farolim de nevoeiro traseiro, regulação dos faróis – sem isso o carro chumba na inspeção.
plan.step.pl.inspection.title=Inspeção técnica num centro de inspeção
plan.step.pl.inspection.text=Primeira inspeção de um veículo importado, incluindo a identificação do VIN; o resultado é enviado para o registo central.
plan.step.pl.recycling.title=Taxa de reciclagem de 500 PLN
plan.step.pl.recycling.text=Paga ao Fundo Nacional do Ambiente na primeira matrícula de um carro importado.
plan.step.pl.registration.title=Matrícula nos serviços de registo automóvel
plan.step.pl.registration.text=Pedido, prova de propriedade com tradução, imposto especial de consumo, inspeção, taxa de reciclagem, comprovativo de IVA/direitos; recebe uma licença provisória e as chapas de matrícula.
plan.step.insurance.title=Seguro de responsabilidade civil
plan.step.insurance.text=Obrigatório a partir da matrícula; vale a pena contratar um seguro de danos próprios após uma avaliação pericial.
plan.step.de.approval.title=Homologação individual (§21 StVZO)
plan.step.de.approval.text=Peritagem técnica completa (TÜV/DEKRA) para carros de fora da UE; necessária para a matrícula.
plan.step.de.registration.title=Matrícula (Zulassung)
plan.step.de.registration.text=Número de seguro eVB, comprovativo de desalfandegamento, relatório pericial, autorização de débito direto SEPA para o imposto automóvel.
plan.step.generic.inspection.title=Inspeção / homologação individual
plan.step.generic.inspection.text=O âmbito depende do país – os carros de fora da UE precisam muitas vezes de homologação individual.
plan.step.generic.registrationTax.title=Imposto nacional de matrícula
plan.step.generic.registrationTax.text=P. ex. BPM nos Países Baixos, NoVA na Áustria, malus em França – verifique antes de comprar.
plan.step.generic.registration.title=Matrícula do veículo
plan.step.generic.registration.text=Apresente o pedido com o comprovativo de desalfandegamento, a inspeção e o seguro.
plan.step.evCharging.title=Tomada de carregamento
plan.step.evCharging.text=Os carros dos EUA usam NACS/CCS1 – precisa de um adaptador ou da substituição da tomada por uma CCS2/Tipo 2.
