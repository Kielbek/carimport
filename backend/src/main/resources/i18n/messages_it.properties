plan.step.clearance.title=Sdoganamento in porto
plan.step.clearance.text=Lo spedizioniere doganale presenta la dichiarazione (DAU); tu paghi il dazio e l’IVA all’importazione. Servono: fattura, polizza di carico, Title/certificato di esportazione, EORI.
plan.step.pl.excise.title=Dichiarazione e pagamento dell’accisa (AKC-U/S)
plan.step.pl.excise.text=Presentala all’ufficio delle imposte (o online) e paga l’accisa; la conferma è necessaria per l’immatricolazione.
plan.step.pl.exciseExemption.title=Dichiarazione di esenzione dall’accisa (auto elettrica)
plan.step.pl.exciseExemption.text=Le auto elettriche sono esenti, ma la dichiarazione AKC-U/S va comunque presentata.
plan.step.translations.title=Traduzioni giurate
plan.step.translations.text=Title/documento di immatricolazione estero, fattura e documento di esportazione – da un traduttore giurato.
plan.step.lighting.title=Adeguamento delle luci agli standard UE
plan.step.lighting.text=Indicatori di direzione posteriori arancioni, retronebbia, regolazione dei fari – senza questi l’auto non supera la revisione.
plan.step.pl.inspection.title=Revisione tecnica presso un centro di controllo
plan.step.pl.inspection.text=Prima revisione di un veicolo importato con identificazione del VIN; l’esito viene trasmesso al registro centrale.
plan.step.pl.recycling.title=Contributo di riciclo 500 PLN
plan.step.pl.recycling.text=Versato al Fondo nazionale per l’ambiente alla prima immatricolazione di un’auto importata.
plan.step.pl.registration.title=Immatricolazione presso l’ufficio veicoli
plan.step.pl.registration.text=Domanda, prova di proprietà con traduzione, accisa, revisione, contributo di riciclo, prova di pagamento di IVA/dazio; ricevi un permesso provvisorio e le targhe.
plan.step.insurance.title=RC auto
plan.step.insurance.text=Obbligatoria dall’immatricolazione; conviene stipulare una kasko dopo una perizia di stima.
plan.step.de.approval.title=Omologazione individuale (§21 StVZO)
plan.step.de.approval.text=Perizia tecnica completa (TÜV/DEKRA) per le auto extra UE; necessaria per l’immatricolazione.
plan.step.de.registration.title=Immatricolazione (Zulassung)
plan.step.de.registration.text=Codice assicurativo eVB, prova dello sdoganamento, perizia tecnica, mandato SEPA per la tassa automobilistica.
plan.step.generic.inspection.title=Revisione / omologazione individuale
plan.step.generic.inspection.text=L’ambito dipende dal Paese – le auto extra UE spesso necessitano di un’omologazione individuale.
plan.step.generic.registrationTax.title=Imposta nazionale di immatricolazione
plan.step.generic.registrationTax.text=Ad es. BPM nei Paesi Bassi, NoVA in Austria, malus in Francia – verifica prima dell’acquisto.
plan.step.generic.registration.title=Immatricolazione del veicolo
plan.step.generic.registration.text=Presenta la domanda con la prova dello sdoganamento, la revisione e l’assicurazione.
plan.step.evCharging.title=Presa di ricarica
plan.step.evCharging.text=Le auto statunitensi usano NACS/CCS1 – serve un adattatore o la sostituzione della presa con una CCS2/Tipo 2.
