plan.step.clearance.title=Customs clearance at the port
plan.step.clearance.text=The customs agent files the declaration (SAD); you pay duty and import VAT. Needed: invoice, bill of lading, title/export certificate, EORI.
plan.step.pl.excise.title=Excise return and payment (AKC-U/S)
plan.step.pl.excise.text=File with the tax office (or online) and pay the excise; the confirmation is needed for registration.
plan.step.pl.exciseExemption.title=Excise exemption filing (electric car)
plan.step.pl.exciseExemption.text=Electric cars are exempt, but the AKC-U/S return must still be filed.
plan.step.translations.title=Sworn translations
plan.step.translations.text=Foreign title/registration, invoice and export document – by a sworn translator.
plan.step.lighting.title=Lighting conversion to EU standards
plan.step.lighting.text=Amber rear indicators, rear fog light, headlight aim – the car fails the inspection without it.
plan.step.pl.inspection.title=Technical inspection at a test station
plan.step.pl.inspection.text=First inspection of an imported vehicle incl. VIN identification; the result goes to the central register.
plan.step.pl.recycling.title=Recycling fee PLN 500
plan.step.pl.recycling.text=Paid to the National Environmental Fund on first registration of an imported car.
plan.step.pl.registration.title=Registration at the vehicle office
plan.step.pl.registration.text=Application, proof of ownership with translation, excise, inspection, recycling fee, VAT/duty proof; you get a temporary permit and plates.
plan.step.insurance.title=Liability insurance
plan.step.insurance.text=Mandatory from registration; comprehensive cover is worth arranging after an expert valuation.
plan.step.de.approval.title=Individual approval (§21 StVZO)
plan.step.de.approval.text=Full expert inspection (TÜV/DEKRA) for non-EU cars; required for registration.
plan.step.de.registration.title=Registration (Zulassung)
plan.step.de.registration.text=Insurance eVB number, customs clearance proof, expert report, SEPA mandate for vehicle tax.
plan.step.generic.inspection.title=Inspection / individual approval
plan.step.generic.inspection.text=Scope depends on the country – non-EU cars often need individual approval.
plan.step.generic.registrationTax.title=National registration tax
plan.step.generic.registrationTax.text=E.g. BPM in the Netherlands, NoVA in Austria, malus in France – check before buying.
plan.step.generic.registration.title=Vehicle registration
plan.step.generic.registration.text=Apply with customs clearance proof, inspection and insurance.
plan.step.evCharging.title=Charging port
plan.step.evCharging.text=US cars use NACS/CCS1 – you need an adapter or a CCS2/Type 2 port retrofit.
