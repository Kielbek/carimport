<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title th:text="#{mail.estimate.subject(${car})}">Estimate</title></head>
<body style="margin:0;background:#f2f2f2;font-family:Arial,Helvetica,sans-serif;color:#18181b;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f2f2;padding:24px 12px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:6px;">
      <tr><td style="background:#18181b;color:#ffc000;padding:16px 28px;font-weight:bold;font-size:18px;letter-spacing:.5px;"><img src="cid:logo" width="200" height="56" alt="Carglo" style="display:block;border:0;color:#ffc000;"></td></tr>
      <tr><td style="padding:28px;font-size:15px;line-height:1.55;">
        <p style="margin:0 0 6px;font-size:13px;color:#52525b;" th:text="#{mail.estimate.route(${origin}, ${port}, ${destination})}">USA → Bremerhaven → Germany</p>
        <p style="margin:0 0 18px;font-size:20px;font-weight:bold;" th:text="${car}">2021 Ford Mustang</p>
        <p style="margin:0 0 4px;font-size:13px;color:#52525b;" th:text="#{mail.estimate.totalLabel}">Door to door</p>
        <p style="margin:0 0 18px;font-size:26px;font-weight:bold;" th:text="${min} + ' – ' + ${max}">30 000 – 34 000</p>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;border-top:1px solid #e4e4e7;">
          <tr><td style="padding:9px 0;border-bottom:1px solid #e4e4e7;" th:text="#{mail.estimate.car}">Car with auction fees</td><td align="right" style="padding:9px 0;border-bottom:1px solid #e4e4e7;font-weight:bold;" th:text="${carPrice}">0</td></tr>
          <tr><td style="padding:9px 0;border-bottom:1px solid #e4e4e7;" th:text="#{mail.estimate.transport}">Transport to the port</td><td align="right" style="padding:9px 0;border-bottom:1px solid #e4e4e7;font-weight:bold;" th:text="${transport}">0</td></tr>
          <tr><td style="padding:9px 0;border-bottom:1px solid #e4e4e7;" th:text="#{mail.estimate.taxes}">Duty, VAT and taxes</td><td align="right" style="padding:9px 0;border-bottom:1px solid #e4e4e7;font-weight:bold;" th:text="${taxes}">0</td></tr>
        </table>
        <p style="margin:18px 0 22px;font-size:13px;color:#52525b;" th:text="#{mail.estimate.locked(${locked})}">The report itemises the rest.</p>
        <p style="margin:0 0 22px;"><a th:href="${link}" style="display:inline-block;background:#ffc000;color:#18181b;text-decoration:none;font-weight:bold;padding:13px 22px;border-radius:4px;" th:text="#{mail.estimate.button}">Open the estimate</a></p>
        <p style="margin:0 0 10px;font-size:13px;color:#52525b;" th:text="#{mail.estimate.note}">Rates change.</p>
        <p style="margin:0;font-size:12px;color:#71717a;" th:text="#{mail.estimate.why}">You asked for it.</p>
      </td></tr>
      <tr><td style="padding:16px 28px;border-top:1px solid #e4e4e7;font-size:11px;color:#71717a;line-height:1.5;">
        <span th:text="${company.name()}">Carglo</span><span th:if="${!#strings.isEmpty(company.address())}" th:text="' · ' + ${company.address()}"></span>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
